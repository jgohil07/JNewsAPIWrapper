# GitHub disables scheduled workflows in a public repository after 60 days without repository activity. The site
# deploys never commit, so this monthly job commits a one-line heartbeat to keep the 6-hourly refresh running.
name: Keepalive

on:
  schedule:
    - cron: '41 3 1 * *'   # 03:41 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "Keepalive heartbeat (keeps scheduled workflows enabled)"
          git push
